name: RoomScanner
options:
  bundleIdPrefix: com.clean.code
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  RoomScanner:
    type: application
    platform: iOS
    sources: [RoomScanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clean.code.RoomScanner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: RoomScanner/Resources/Info.plist
      properties:
        CFBundleDisplayName: RoomScanner
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "RoomScanner usa la cámara y el escáner LiDAR para medir habitaciones y crear planos. Las mediciones se suben al servidor de tu organización."
        APIBaseURL: "$(API_BASE_URL)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "RoomScanner se conecta a un servidor de tu red local para iniciar sesión y subir mediciones."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  RoomScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RoomScannerTests]
    dependencies:
      - target: RoomScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RoomScanner:
    build:
      targets:
        RoomScanner: all
        RoomScannerTests: [test]
    test:
      targets: [RoomScannerTests]
      gatherCoverageData: true
